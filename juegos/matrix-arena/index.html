<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Matrix Arena: un valle pixel 3D para aprender matrices jugando, con evaluación formativa, multijugador y panel docente.">
<style>:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}html,body{margin:0}body{font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Matrix Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Rubik:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: juego a pantalla completa (mundo voxel pixelado) + paneles de madera y pergamino que se abren al entrar a cada edificio. Look único (día de valle), por decisión. */
:root{
  --wood:#5b3a22; --wood2:#8a5a33; --wood3:#b07a45;
  --paper:#f7e9c6; --paper2:#ecd7a4; --paper3:#e2c88c;
  --ink:#2a1c11; --ink2:#5e4630;
  --teal:#1d8a7b; --teal2:#2fb9a4; --violet:#6a4ea3; --gold:#d99a1e;
  --ok:#3d8a35; --warn:#b97a0c; --err:#b8392f; --mut:#8a7660;
  --night:#24341f;
  --fd:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;
  --fb:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fm:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--fb);overflow:hidden;font-size:15px}
#game{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none;cursor:pointer}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* HUD */
.hud{position:fixed;z-index:5;pointer-events:none;font-family:var(--fd)}
.hud > *{pointer-events:auto}
#hud-tl{top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
#hud-tr{top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.wbox{background:var(--paper);border:3px solid var(--wood);box-shadow:0 3px 0 var(--wood),inset 0 0 0 2px var(--paper2);border-radius:4px;padding:6px 10px;color:var(--ink)}
#avatarBtn{display:flex;gap:10px;align-items:center;text-align:left}
#avatarBtn canvas{width:36px;height:36px;image-rendering:pixelated;background:var(--paper2);border:2px solid var(--wood2)}
.lvl{font-size:13px;color:var(--ink2)}
.xpbar{height:7px;background:var(--paper3);border:1px solid var(--wood2);margin-top:3px;width:110px}
.xpbar i{display:block;height:100%;background:var(--teal)}
.coin{display:inline-block;width:12px;height:12px;background:var(--gold);border:2px solid #8b5e10;border-radius:50%;vertical-align:-1px;margin-right:4px}
#clock{font-size:15px;display:flex;flex-direction:column;justify-content:center}
#prompt{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));font-family:var(--fd);font-size:17px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
#prompt kbd{background:var(--wood);color:var(--paper);padding:1px 7px;border-radius:3px;font-family:var(--fd)}
#help{position:fixed;z-index:4;left:max(12px,env(safe-area-inset-left,0px));top:calc(86px + env(safe-area-inset-top,0px));font-size:12px;color:var(--paper);font-family:var(--fd);text-shadow:0 1px 0 #000;opacity:.9;max-width:46%}
.blabel{position:fixed;z-index:3;transform:translate(-50%,-100%);font-family:var(--fd);font-size:14px;background:var(--wood);color:var(--paper);padding:2px 8px;border-radius:3px;white-space:nowrap;border:2px solid var(--wood3);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.blabel small{display:block;font-size:10px;color:var(--paper3);text-align:center}
/* Overlay / panels */
#overlay{position:fixed;inset:0;z-index:20;background:rgba(20,14,8,.55);overflow:auto;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{max-width:1040px;margin:0 auto;background:var(--paper);border:4px solid var(--wood);border-radius:6px;box-shadow:0 6px 0 var(--wood),0 0 0 4px var(--wood3) inset;position:relative}
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--wood);color:var(--paper);padding:10px 16px;font-family:var(--fd)}
.ph h2{margin:0;font-size:22px;font-weight:700;letter-spacing:.02em;text-wrap:balance}
.ph .sub{font-size:13px;color:var(--paper3);font-family:var(--fb)}
.ph .sp{flex:1}
.pb{padding:16px;display:grid;gap:16px}
.close{background:var(--err);color:#fff;border:2px solid #7a2019;border-radius:4px;font-family:var(--fd);font-size:15px;padding:4px 12px}
h3{font-family:var(--fd);font-size:18px;margin:0 0 8px;color:var(--wood)}
h4{font-family:var(--fd);font-size:15px;margin:0 0 6px;color:var(--ink2)}
p{margin:0 0 8px;line-height:1.5;max-width:72ch}
.btn{background:var(--teal);color:#fff;border:2px solid #0f5249;border-radius:4px;padding:7px 12px;font-family:var(--fd);font-size:15px;box-shadow:0 3px 0 #0f5249;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0f5249}
.btn.alt{background:var(--paper2);color:var(--ink);border-color:var(--wood2);box-shadow:0 3px 0 var(--wood2)}
.btn.vio{background:var(--violet);border-color:#3e2b66;box-shadow:0 3px 0 #3e2b66}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--paper2);border:2px solid var(--paper3);border-radius:5px;padding:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:10px;color:#fff;background:var(--mut);letter-spacing:.03em;white-space:nowrap}
.chip.ok{background:var(--ok)}.chip.eff{background:var(--teal)}.chip.warn{background:var(--warn)}.chip.err{background:var(--err)}.chip.vio{background:var(--violet)}.chip.gold{background:var(--gold);color:var(--ink)}
.synth{background:repeating-linear-gradient(45deg,var(--gold),var(--gold) 6px,#e7b44a 6px,#e7b44a 12px);color:var(--ink);font-weight:700;padding:3px 8px;border-radius:3px;font-size:12px;font-family:var(--fd)}
select,input[type=text],input[type=number],textarea{font-family:var(--fm);font-size:14px;background:#fffaf0;border:2px solid var(--wood2);border-radius:4px;padding:5px 7px;color:var(--ink)}
textarea{width:100%;min-height:160px;font-size:12px}
label{font-size:13px;color:var(--ink2)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:var(--paper2);border:2px solid var(--wood2);border-radius:4px 4px 0 0;padding:5px 12px;font-family:var(--fd);font-size:14px;color:var(--ink)}
.tab[aria-selected=true]{background:var(--wood2);color:var(--paper)}
table{border-collapse:collapse;font-size:13px;width:100%}
th,td{border-bottom:1px solid var(--paper3);padding:5px 6px;text-align:left;vertical-align:top}
th{font-family:var(--fd);font-weight:600;color:var(--wood);font-size:13px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--fm)}
.scroll{overflow-x:auto;max-width:100%}
.muted{color:var(--mut);font-size:13px}
.mono{font-family:var(--fm)}
/* Matrix */
.mxwrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mx{display:inline-grid;gap:3px 4px;padding:6px 10px;position:relative;font-family:var(--fm);font-variant-numeric:tabular-nums}
.mx::before,.mx::after{content:"";position:absolute;top:0;bottom:0;width:8px;border:3px solid var(--ink);}
.mx::before{left:0;border-right:none}.mx::after{right:0;border-left:none}
.mx .c{min-width:3.1em;text-align:center;padding:5px 4px;background:#fffaf0;border:1px solid var(--paper3);border-radius:3px;font-size:15px;transition:background .4s, box-shadow .4s}
.mx .c.R{background:#eef7f4}
.mx .c.hit{background:#bff0e5;box-shadow:0 0 0 2px var(--teal2)}
.mx .c.bad{box-shadow:0 0 0 2px var(--err);background:#fde3df}
.mx .c.idok{color:var(--teal);font-weight:600}
.mx .div{width:2px;background:var(--ink2);margin:0 3px;border-radius:1px}
.mx input{width:4.2em;text-align:center;padding:5px 2px;font-size:14px}
.mx .rl{font-family:var(--fd);font-size:13px;color:var(--ink2);align-self:center;padding-right:4px;background:none;border:0}
.mx .rl.sel{color:var(--teal);font-weight:700}
.mx.small .c{min-width:2.4em;font-size:12px;padding:3px}
.board{background:linear-gradient(var(--paper),var(--paper2));border:3px solid var(--wood2);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;min-width:0;overflow-x:auto}
.meter{height:10px;width:220px;max-width:100%;background:var(--paper3);border:1px solid var(--wood2);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));transition:width .5s}
.fb{border-left:6px solid var(--teal);background:#fff6df;padding:10px 12px;border-radius:4px}
.fb.err{border-color:var(--err)}.fb.warn{border-color:var(--warn)}.fb.ok{border-color:var(--ok)}
.hist{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto}
.hist button{display:flex;gap:8px;align-items:center;text-align:left;background:#fffaf0;border:1px solid var(--paper3);border-radius:4px;padding:5px 8px;font-size:13px;font-family:var(--fm)}
.hist button[aria-current=true]{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal2)}
.swapanim{animation:swp .45s ease}
@keyframes swp{0%{transform:translateY(-6px);opacity:.3}100%{transform:none;opacity:1}}
.flash{animation:fl .6s ease}
@keyframes fl{0%{transform:scale(1.03)}100%{transform:none}}
svg text{font-family:var(--fb);fill:var(--ink)}
svg .ax{stroke:var(--ink2);stroke-width:1}
svg .gr{stroke:var(--paper3);stroke-width:1}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.badge{display:flex;gap:8px;align-items:center;padding:6px 8px;border:2px dashed var(--paper3);border-radius:5px;font-size:13px}
.badge.on{border-style:solid;border-color:var(--gold);background:#fff2cc}
.badge i{width:22px;height:22px;flex:none;background:var(--mut);clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
.badge.on i{background:var(--gold)}
.swatch{width:26px;height:26px;border:2px solid var(--wood);border-radius:3px}
.swatch[aria-pressed=true]{outline:3px solid var(--teal);outline-offset:1px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
#toast{position:fixed;z-index:40;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-family:var(--fd);font-size:16px;transition:opacity .3s;max-width:calc(100% - 32px)}
.dlg{max-width:560px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--fd);font-size:24px;color:var(--wood)}
.kpi span{font-size:12px;color:var(--ink2)}
.steps li{margin-bottom:6px}
.dstep{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px;border:2px solid var(--paper3);border-radius:5px;background:#fffaf0;width:100%;text-align:left;font-size:14px}
.dstep[aria-pressed=true]{border-color:var(--err);background:#fde9e5}
.doc h3{margin-top:6px}
.doc ul{margin:0 0 8px;padding-left:20px;line-height:1.5}
#help{background:rgba(20,14,8,.6);padding:3px 8px;border-radius:3px;max-width:340px;font-size:11px}
#hud-tr{flex-direction:column;align-items:flex-end}
#quest{max-width:270px;font-family:var(--fb);font-size:12px;display:flex;flex-direction:column;gap:4px;line-height:1.35}
#quest b{font-family:var(--fd);font-size:13px;color:var(--wood)}
#questSeals{display:flex;gap:7px;align-items:center;padding-left:3px}
#questSeals i{width:12px;height:12px;border:2px solid var(--wood);transform:rotate(45deg);display:inline-block}
#questSeals span{margin-left:4px;font-family:var(--fd)}
.candy{display:inline-block;width:12px;height:8px;background:#f06fb0;border:2px solid #8a2f60;border-radius:3px;margin-right:4px;vertical-align:0}
#dlg{position:fixed;z-index:15;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(720px,calc(100% - 32px));min-height:96px;padding:18px 20px 16px;font-size:17px;line-height:1.45;cursor:pointer;border-width:4px;font-family:var(--fb)}
#dName{position:absolute;top:-15px;left:14px;background:var(--wood);color:var(--paper);font-family:var(--fd);font-size:14px;padding:2px 10px;border-radius:3px}
#dMore{position:absolute;right:14px;bottom:6px;color:var(--wood);animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#dOpts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#dOpts:empty{display:none}
#dOpts input{flex:1;min-width:140px;font-family:var(--fb);font-size:16px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:25;transition:opacity .25s}
#banner{position:fixed;z-index:6;top:calc(120px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-family:var(--fd);font-size:18px;padding:8px 16px}
#banner.show{animation:bn 2.6s ease forwards}
@keyframes bn{0%{opacity:0;transform:translate(-50%,-10px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
.plabel{position:fixed;z-index:3;transform:translate(-50%,-100%);font-family:var(--fd);font-size:12px;background:rgba(29,138,123,.92);color:#fff;padding:1px 7px;border-radius:3px;white-space:nowrap;pointer-events:none;border:1px solid #0f5249}
#netBadge{font-size:12px;font-family:var(--fb);display:flex;align-items:center}
#hud-tr .row{flex-wrap:wrap}
.touchpad{display:none}
.split{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:6px}
.bcard{cursor:pointer;text-align:left;padding:6px;display:grid;gap:4px;font-size:12px;transition:transform .1s}
.bcard:hover:not([disabled]){transform:translateY(-2px);border-color:var(--teal)}
.hpbars{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.meter.hp{width:min(260px,100%);height:12px}
#btCv{width:100%;max-width:760px;justify-self:center;image-rendering:pixelated;border:3px solid var(--wood2);border-radius:4px;background:#e6cf9a}
@media (max-width:640px){
  #quest{max-width:160px;font-size:11px}
  #hud-tl{max-width:calc(100% - 184px)}
  #netBadge,#musBtn,#sndBtn{font-size:11px;padding:4px 6px}
  #banner{top:calc(150px + env(safe-area-inset-top,0px));font-size:15px}
  #dlg{font-size:15px}
  .split{grid-template-columns:1fr}
  body{font-size:14px}
  #help{display:none}
  .ph h2{font-size:18px}
  .xpbar{width:70px}
  .mx .c{min-width:2.5em;font-size:13px}
  .mx input{width:3.4em}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<canvas id="game" aria-label="Valle Matricia: mundo del juego"></canvas>
<div id="peerLabels"></div>
<div class="hud" id="hud-tl">
  <button class="wbox" id="avatarBtn" aria-label="Abrir mi perfil">
    <canvas id="avatarCv" width="12" height="12"></canvas>
    <span><span id="hudName">Aprendiz</span><br><span class="lvl" id="hudLvl">Nivel 1</span><span class="xpbar"><i id="hudXp" style="width:0"></i></span></span>
  </button>
  <div class="wbox" id="clock"><span id="clockT">Día 1 · 08:00</span><span class="lvl"><span class="coin"></span><span id="hudCoins">0</span> semillas · <span class="candy"></span><span id="hudCandy">0</span> dulces</span></div>
</div>
<div class="hud" id="hud-tr">
  <div class="wbox" id="quest"><b>Misión · Faro Matricial</b><div id="questSeals"></div><span id="questT"></span></div>
  <div class="row" style="gap:6px;justify-content:flex-end"><span class="wbox" id="netBadge">Conectando…</span><button class="wbox" id="musBtn" aria-pressed="false">Música: no</button><button class="wbox" id="sndBtn" aria-pressed="false" title="Efectos de sonido">Efectos: no</button></div>
</div>
<div id="help">WASD / flechas o clic para caminar · E para hablar · camina hacia una puerta para entrar</div>
<div id="prompt" class="wbox" hidden></div>
<div id="toast" class="wbox" hidden></div>
<canvas id="confetti"></canvas>
<div id="dlg" class="wbox" hidden role="dialog" aria-live="polite"><span id="dName"></span><div id="dText"></div><div id="dOpts"></div><span id="dMore" aria-hidden="true">▼</span></div>
<div id="banner" class="wbox" hidden></div>
<div id="fade"></div>
<div id="overlay" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="red.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* =========================================================
   0. UTILIDADES
   ========================================================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function randn(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const sigmoid=x=>1/(1+Math.exp(-x));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const uid=()=>Math.random().toString(36).slice(2,10);
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function toast(msg,ms=2600){const t=$('#toast');t.textContent=msg;t.hidden=false;t.style.opacity=1;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.hidden=true,300)},ms)}

/* =========================================================
   1. MOTOR MATEMÁTICO EXACTO (fracciones)
   ========================================================= */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1}
class Fr{
  constructor(n,d=1){if(!d)throw new Error('División por cero');if(d<0){n=-n;d=-d}const g=gcd(n,d);this.n=n/g;this.d=d/g;if(Object.is(this.n,-0))this.n=0}
  static of(x){return x instanceof Fr?x:new Fr(x,1)}
  add(o){o=Fr.of(o);return new Fr(this.n*o.d+o.n*this.d,this.d*o.d)}
  sub(o){o=Fr.of(o);return new Fr(this.n*o.d-o.n*this.d,this.d*o.d)}
  mul(o){o=Fr.of(o);return new Fr(this.n*o.n,this.d*o.d)}
  div(o){o=Fr.of(o);return new Fr(this.n*o.d,this.d*o.n)}
  neg(){return new Fr(-this.n,this.d)}
  z(){return this.n===0}
  eq(o){o=Fr.of(o);return this.n===o.n&&this.d===o.d}
  s(){return this.d===1?String(this.n):this.n+'/'+this.d}
  v(){return this.n/this.d}
  static parse(str){
    str=String(str).trim().replace(',','.').replace('−','-');
    if(/^[-+]?\d+$/.test(str))return new Fr(parseInt(str,10));
    let m=str.match(/^([-+]?\d+)\s*\/\s*([-+]?\d+)$/);
    if(m){const d=parseInt(m[2],10);if(!d)return null;return new Fr(parseInt(m[1],10),d)}
    m=str.match(/^([-+]?)(\d*)\.(\d+)$/);

const fmt=f=>f.s().replace(/-/g,'−');
const fmtK=f=>{const s=fmt(f);return (f.n<0||f.d!==1)?'('+s+')':s};
const Mx={
  id:n=>Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>new Fr(i===j?1:0))),
  from:a=>a.map(r=>r.map(x=>x instanceof Fr?x:Fr.parse(x))),
  str:M=>M.map(r=>r.map(x=>x.s())),
  clone:M=>M.map(r=>r.slice()),
  mul:(A,B)=>A.map(r=>B[0].map((_,j)=>r.reduce((s,a,k)=>s.add(a.mul(B[k][j])),new Fr(0)))),
  T:A=>A[0].map((_,j)=>A.map(r=>r[j])),
  eq:(A,B)=>A.length===B.length&&A.every((r,i)=>r.every((x,j)=>x.eq(B[i][j]))),
  aug:A=>{const I=Mx.id(A.length);return A.map((r,i)=>r.concat(I[i]))},
  left:(M,n)=>M.map(r=>r.slice(0,n)),
  right:(M,n)=>M.map(r=>r.slice(n)),
  det(A){const n=A.length;let M=Mx.clone(A),d=new Fr(1);
    for(let c=0;c<n;c++){let p=c;while(p<n&&M[p][c].z())p++;if(p===n)return new Fr(0);
      if(p!==c){[M[p],M[c]]=[M[c],M[p]];d=d.neg()}
      d=d.mul(M[c][c]);
      for(let r=c+1;r<n;r++){const f=M[r][c].div(M[c][c]);M[r]=M[r].map((x,j)=>x.sub(f.mul(M[c][j])))}}
    return d},
  inv(A){const n=A.length;if(Mx.det(A).z())return null;let M=Mx.aug(A);let op;while((op=suggestOp(M,n)))M=applyOp(M,op);return Mx.right(M,n)}
};
function applyOp(M,op){const R=Mx.clone(M);
  if(op.t==='swap'){[R[op.i],R[op.j]]=[R[op.j],R[op.i]]}
  else if(op.t==='scale'){R[op.i]=R[op.i].map(x=>x.mul(op.k))}
  else{R[op.i]=R[op.i].map((x,c)=>x.add(op.k.mul(M[op.j][c])))}
  return R}
function opText(op){const F=i=>'F'+(i+1);
  if(op.t==='swap')return `${F(op.i)} ↔ ${F(op.j)}`;
  if(op.t==='scale')return `${F(op.i)} ← ${fmtK(op.k)}·${F(op.i)}`;
  return `${F(op.i)} ← ${F(op.i)} + ${fmtK(op.k)}·${F(op.j)}`}
/* Siguiente paso canónico de Gauss-Jordan (sirve para sugerir alternativas, no para exigir un único camino) */
function suggestOp(M,n){
  for(let c=0;c<n;c++){
    if(M[c][c].z()){for(let r=c+1;r<n;r++)if(!M[r][c].z())return{t:'swap',i:c,j:r};return null}
    if(!M[c][c].eq(1))return{t:'scale',i:c,k:new Fr(1).div(M[c][c])};
    for(let r=0;r<n;r++)if(r!==c&&!M[r][c].z())return{t:'add',i:r,j:c,k:M[r][c].neg()};
  }return null}
function idProgress(M,n){let s=0;for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(M[i][j].eq(i===j?1:0))s++;return s}
function canonicalLength(A){const n=A.length;let M=Mx.aug(A),k=0,op;while((op=suggestOp(M,n))&&k<40){M=applyOp(M,op);k++}return k}
/* Generación de ejercicios con dificultad controlada */
function genMatrix(n,rng=Math.random){
  const ri=(a,b)=>a+Math.floor(rng()*(b-a+1));
  for(let tries=0;tries<500;tries++){
    let A;
    if(n===2){A=[[ri(-4,5),ri(-4,4)],[ri(-4,4),ri(-4,5)]].map(r=>r.map(x=>new Fr(x)))}
    else{
      const L=Mx.id(3),U=Mx.id(3);
      L[1][0]=new Fr(ri(-2,2));L[2][0]=new Fr(ri(-2,2));L[2][1]=new Fr(ri(-2,2));
      U[0][1]=new Fr(ri(-2,2));U[0][2]=new Fr(ri(-2,2));U[1][2]=new Fr(ri(-2,2));
      U[0][0]=new Fr([1,2,1][ri(0,2)]);U[1][1]=new Fr([1,-1,1][ri(0,2)]);U[2][2]=new Fr([1,1,-1,2][ri(0,3)]);
      A=Mx.mul(L,U);if(rng()<.3){[A[0],A[1]]=[A[1],A[0]]}
    }
    const d=Mx.det(A);if(d.z())continue;
    const ad=Math.abs(d.v());if(n===2&&!(ad<=3))continue;if(n===3&&ad>2)continue;
    if(A.flat().some(x=>Math.abs(x.v())>7))continue;
    if(idProgress(Mx.aug(A),n)>n*n-2)continue;
    const inv=Mx.inv(A);if(inv.flat().some(x=>x.d>3||Math.abs(x.v())>12))continue;
    return A}
  return Mx.from(n===2?[[2,1],[5,3]]:[[1,2,0],[2,5,1],[0,1,2]]);
}

  E_SCALE0:{cat:'conceptual',name:'Multiplicar una fila por 0 no es una operación elemental',concept:'Operaciones elementales',h:['Multiplicar por 0 borra la fila y no se puede deshacer.','Las operaciones elementales deben ser reversibles: por eso k ≠ 0 al escalar.']},
  E_SAME_ROW:{cat:'procedimental',name:'Sumar a una fila un múltiplo de sí misma',concept:'Operaciones elementales',h:['Elige una fila pivote distinta de la que modificas.','Fi ← Fi + k·Fi equivale a escalar por (1+k), y si k = −1 borra la fila.']},
  E_SWAP_SAME:{cat:'procedimental',name:'Intercambio de una fila consigo misma',concept:'Operaciones elementales',h:['Elige dos filas distintas para intercambiar.','Un intercambio necesita dos filas diferentes.']},
  E_T_INV:{cat:'conceptual',name:'Confunde transpuesta con inversa',concept:'Inversa vs transpuesta',h:['La transpuesta intercambia filas y columnas; la inversa deshace la transformación.','Comprueba: A·Aᵀ casi nunca es I. A·A⁻¹ = I siempre.']},
  E_READ_INV:{cat:'interpretación',name:'No identifica la inversa en el bloque derecho',concept:'Interpretación de Gauss-Jordan',h:['Al terminar, [A | I] se convirtió en [I | ?].','El bloque derecho acumula las operaciones aplicadas a I: ese bloque es A⁻¹.']},

/* Diagnóstico basado en reglas verificables. Devuelve errores confirmados (patrón exacto) o inciertos. */
function diagnose(op,prev,entered,expected,n){
  const N=2*n,all=[...Array(N).keys()],L=all.slice(0,n),R=all.slice(n);
  const P=prev[op.i],Q=op.j!=null?prev[op.j]:null;
  const same=(a,b,idx)=>idx.every(t=>a[t].eq(b[t]));
  const wrong=all.filter(t=>!entered[t].eq(expected[t]));
  if(!wrong.length)return{ok:true};
  const res=(code,conf,ev)=>({ok:false,code,conf,wrong,evidence:ev});
  if(!same(expected,P,R)&&same(entered,expected,L)&&same(entered,P,R))return res('E_PART_AUG','alta','Bloque izquierdo correcto; bloque derecho sin transformar.');
  if(!same(expected,P,L)&&same(entered,expected,R)&&same(entered,P,L))return res('E_PART_AUG','alta','Bloque derecho correcto; bloque izquierdo sin transformar.');
  if(op.t==='add'){
    const alt1=P.map((x,c)=>x.sub(op.k.mul(Q[c])));if(same(entered,alt1,all))return res('E_SIGN_K','alta','Todas las entradas coinciden con Fi − k·Fj.');
    if(!op.k.eq(1)){const alt2=P.map((x,c)=>x.add(Q[c]));if(same(entered,alt2,all))return res('E_NO_K','alta','Todas las entradas coinciden con Fi + Fj (sin multiplicar por k).')}
    const alt3=P.map((x,c)=>op.k.mul(x).add(Q[c]));if(!op.k.eq(1)&&same(entered,alt3,all))return res('E_K_WRONG_ROW','alta','Todas las entradas coinciden con k·Fi + Fj.');
  }
  if(op.t==='scale'&&!op.k.eq(1)&&!op.k.eq(-1)){const alt=P.map(x=>x.div(op.k));if(same(entered,alt,all))return res('E_INV_K','alta','Todas las entradas coinciden con Fi / k.')}
  if(op.t==='scale'&&!op.k.eq(-1)){const alt=P.map(x=>x.mul(op.k.neg()));if(same(entered,alt,all))return res('E_SIGN_K','alta','Todas las entradas coinciden con (−k)·Fi.')}
  const changed=all.filter(t=>!expected[t].eq(P[t]));
  if(wrong.length>=1&&wrong.every(t=>entered[t].eq(P[t]))&&wrong.length<changed.length)return res('E_PART_ROW','media','Las entradas erróneas conservan su valor anterior.');
  if(wrong.length<=2&&wrong.every(t=>entered[t].eq(expected[t].neg())))return res('E_SIGN','media','La(s) entrada(s) tienen el valor correcto con el signo cambiado.');
  if(wrong.length===1){const t=wrong[0];if(expected[t].d!==1||entered[t].d!==1)return res('E_FRAC','media','Una sola entrada con fracciones es incorrecta.');return res('E_ARITH','media','Una sola entrada entera es incorrecta.')}
  return res('E_UNCERTAIN','baja','Varias entradas incorrectas sin patrón reconocible.');
}

  while(h<q.length){const c=q[h++];if(c===t)break;const cx=c%W,cz=(c/W)|0;for(const[dx,dz]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,nz=cz+dz;if(nx<0||nz<0||nx>=W||nz>=H)continue;const n=zt(zn,nx,nz);if(zn.blocked[n]||prev[n]!==-1||trig.has(n))continue;prev[n]=c;q.push(n)}}

  for(const n of Z.npcs){const d0=Math.hypot(player.position.x-n.ch.position.x,player.position.z-n.ch.position.z),d1=Math.hypot(x-n.ch.position.x,z-n.ch.position.z);if(d1<.55&&d1<d0)return false}return true}

      $('#labQ').innerHTML=ok?'<div class="fb ok"><p style="margin:0">Exacto: det(A) = 0 implica que no existe A⁻¹.</p></div>':`<div class="fb err"><p style="margin:0">${esc(ERR.E_ALL_INV.h[1])}</p></div>`})}
  drawLab(A,d)}
function drawLab(A,d){const c=$('#labCv');if(!c)return;const x=c.getContext('2d'),S=300,u=S/8,o=S/2;x.clearRect(0,0,S,S);x.imageSmoothingEnabled=false;
  const a=A[0][0].v(),b=A[0][1].v(),cc=A[1][0].v(),dd=A[1][1].v();const tr=(px,py)=>[o+(a*px+b*py)*u,o-(cc*px+dd*py)*u];
  x.strokeStyle='#e2c88c';x.lineWidth=1;for(let i=-4;i<=4;i++){x.beginPath();x.moveTo(o+i*u,0);x.lineTo(o+i*u,S);x.stroke();x.beginPath();x.moveTo(0,o+i*u);x.lineTo(S,o+i*u);x.stroke()}
  x.strokeStyle='rgba(29,138,123,.35)';for(let i=-4;i<=4;i++){let p=tr(i,-4),q=tr(i,4);x.beginPath();x.moveTo(...p);x.lineTo(...q);x.stroke();p=tr(-4,i);q=tr(4,i);x.beginPath();x.moveTo(...p);x.lineTo(...q);x.stroke()}
  x.fillStyle=d.n<0?'rgba(224,87,75,.35)':'rgba(47,185,164,.45)';x.strokeStyle='#1d8a7b';x.lineWidth=2;x.beginPath();x.moveTo(...tr(0,0));x.lineTo(...tr(1,0));x.lineTo(...tr(1,1));x.lineTo(...tr(0,1));x.closePath();x.fill();x.stroke();
  const arrow=(px,py,colr)=>{const[ex,ey]=tr(px,py);x.strokeStyle=colr;x.fillStyle=colr;x.lineWidth=3;x.beginPath();x.moveTo(o,o);x.lineTo(ex,ey);x.stroke();x.fillRect(ex-4,ey-4,8,8)};
  arrow(1,0,'#e0574b');arrow(0,1,'#6a4ea3');x.fillStyle='#2a1c11';x.font='12px monospace';x.fillText('área = '+Math.abs(d.v()).toFixed(2).replace(/\.00$/,''),8,16)}

function recommendForStudent(){const errs=realEvents.filter(e=>e.error_code&&e.validation!=='correct'&&e.type!=='detective_answer');if(!realEvents.some(e=>e.type==='attempt_start'))return'Empieza por la Academia de Gauss con un desafío 2×2.';

  const cnt={};errs.forEach(e=>cnt[e.error_code]=(cnt[e.error_code]||0)+1);const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  const rec={E_PART_AUG:'Practica aplicando cada operación a la fila completa de [A | I]. En el Laboratorio verás por qué el bloque derecho importa.',E_SIGN_K:'Antes de sumar, escribe k·Fj en una línea aparte y revisa el signo de k.',E_NO_K:'Antes de sumar, multiplica la fila pivote por k entrada a entrada.',E_SIGN:'Revisa los signos al restar números negativos. Un desafío 2×2 corto es buen calentamiento.',E_FRAC:'Repasa la suma de fracciones con denominador común; el nivel 2×2 genera fracciones sencillas.',E_ARITH:'Calcula cada entrada por separado antes de escribirla.',E_T_INV:'Visita el caso 2 del Detective y compara A·Aᵀ con A·A⁻¹.',E_ALL_INV:'Usa el preset «Singular» del Laboratorio para ver qué pasa cuando det(A) = 0.',E_COMP_ORDER:'En el Coliseo, usa «Ensayar» para comparar C₂·C₁ con C₁·C₂ antes de lanzar.',E_TRANSF:'Antes de elegir cartas, mira a dónde va el punto rojo (e₁) en la silueta.',E_DET_INV:'Calcula det(E) antes de decidir entre contrahechizo y barrera.',E_NO_DIVDET:'Recuerda dividir el adjunto entre det(E) y comprobar E⁻¹·E = I.'}[top[0]]||'Revisa tu última partida paso a paso.';
  return `Tu error más frecuente es «${ERR[top[0]].name}» (${top[1]} vez/veces). ${rec}`}

/* =========================================================

function genSynthetic(){const r=mulberry32(20261114);const ev=[];const N=28;const order=[...Array(N).keys()].sort(()=>r()-.5);
  const codesAdd=['E_ARITH','E_SIGN','E_PART_AUG','E_SIGN_K','E_NO_K','E_FRAC','E_UNCERTAIN'],codesScale=['E_ARITH','E_SIGN','E_PART_AUG','E_INV_K','E_FRAC','E_UNCERTAIN'];
  const pattern=['scale','add','add','scale','add','add','scale','add','add'];
  for(let s=0;s<N;s++){const pid='S'+String(s+1).padStart(2,'0');const group=order.indexOf(s)<N/2?'A':'B';const ab=randn(r);
    const prone=codesAdd[Math.floor(r()*codesAdd.length)];
    ['pre','post'].forEach((phase,pi)=>{if(phase==='post'&&(s===5||s===17))return; // abandono => dato faltante
      const imp=phase==='post'?(group==='A'?.95:.55)+ab*.1:0;const att='sa'+s+pi;const base=Date.parse('2026-10-0'+(pi?8:1)+'T10:00:00Z')+s*6e5;let t=base;
      ev.push({event_id:'x'+s+pi+'s',student_pid:pid,session_id:'SES-'+(pi+1),source:'synthetic',group,type:'attempt_start',attempt_id:att,concept:'inversa.gauss_jordan',phase,ts:new Date(t).toISOString()});
      let first=0,total=0,errs=0,hints=0;
      pattern.forEach((opT,k)=>{let tries=0;total++;
        while(true){tries++;const pErr=sigmoid(-1.05-.85*ab-imp+(opT==='add'?.35:0)+(k>5?.2:0))*(tries>1?.55:1);t+=Math.exp(3.3+r()*.8-ab*.2)*1000;
          if(r()>=pErr){if(tries===1)first++;ev.push({event_id:'x'+s+pi+k+'c'+tries,student_pid:pid,session_id:'SES-'+(pi+1),source:'synthetic',group,type:'step_submitted',attempt_id:att,concept:'inversa.gauss_jordan',phase,op_type:opT,step_index:k,validation:'correct',try_n:tries,ts:new Date(t).toISOString()});break}
          const pool=opT==='add'?codesAdd:codesScale;let code=r()<.4&&pool.includes(prone)?prone:pool[Math.floor(r()*pool.length)];const e=ERR[code];const variant=r()<.5?'visual':'conceptual';errs++;
          const pCorr=sigmoid(.55+.7*ab+(variant==='visual'?.55:0)+imp*.3);const willCorrect=r()<pCorr||tries>=3;const hl=tries>=2?Math.min(3,tries):0;hints+=hl;
          ev.push({event_id:'x'+s+pi+k+'e'+tries,student_pid:pid,session_id:'SES-'+(pi+1),source:'synthetic',group,type:'step_submitted',attempt_id:att,concept:'inversa.gauss_jordan',phase,op_type:opT,step_index:k,validation:code==='E_UNCERTAIN'?'uncertain':'error',error_code:code,error_category:e.cat,confidence:code==='E_UNCERTAIN'?'baja':(['E_PART_AUG','E_SIGN_K','E_NO_K','E_INV_K'].includes(code)?'alta':'media'),feedback_variant:variant,hints_used:hl,try_n:tries,followup:willCorrect?(tries>=3?'asistido':'corregido'):'pendiente',ts:new Date(t).toISOString()});
          if(tries>=3){ev.push({event_id:'x'+s+pi+k+'a',student_pid:pid,session_id:'SES-'+(pi+1),source:'synthetic',group,type:'step_assisted',attempt_id:att,concept:'inversa.gauss_jordan',phase,op_type:opT,step_index:k,validation:'not_assessed',ts:new Date(t).toISOString()});break}
          if(!willCorrect)continue}});
      const interpOk=r()<sigmoid(1+ab+imp);ev.push({event_id:'x'+s+pi+'i',student_pid:pid,session_id:'SES-'+(pi+1),source:'synthetic',group,type:'interpretation',attempt_id:att,concept:'inversa.interpretacion',phase,validation:interpOk?'correct':'error',error_code:interpOk?null:(r()<.6?'E_T_INV':'E_READ_INV'),error_category:interpOk?null:'conceptual',ts:new Date(t).toISOString()});

  const srcTxt=!TR.data?'Cargando…':TR.data.src==='cloud'?`Datos reales de la clase (${TR.data.roster.length} ciudadanos en la nube)`:'Datos de este dispositivo (sin acceso a la nube de la clase)';
  o.innerHTML=`<div class="panel">${head('Oficina del Alcalde · Informe de los ciudadanos','Rol docente · '+esc(srcTxt),`<label style="color:var(--paper3)"><input type="checkbox" id="trSyn" ${TR.synth?'checked':''}> Incluir cohorte sintética</label><label style="color:var(--paper3)"><input type="checkbox" id="trAnon" ${TR.anon?'checked':''}> Seudónimos</label><button class="btn sm alt" id="trReload">Actualizar</button>`)}
   <div class="pb">${TR.err?`<div class="fb warn"><p style="margin:0">${esc(TR.err)}</p></div>`:''}${TR.synth?'<div class="row"><span class="synth">DATOS SINTÉTICOS INCLUIDOS</span><span class="muted">S01–S28 son simulados; no los uses para evaluar a nadie.</span></div>':''}
   <div class="tabs">${[['resumen','Resumen'],['ciudadanos','Ciudadanos'],['estudiante','Estudiante'],['grupo','Errores del grupo'],['rec','Recomendaciones'],['exportar','Exportar']].map(([k,l])=>`<button class="tab" data-tt="${k}" aria-selected="${TR.tab===k}">${l}</button>`).join('')}</div>
   <div id="trBody">${!TR.data?'<p class="muted">Cargando los datos de la clase…</p>':''}</div></div></div>`;
  o.querySelector('.close').onclick=closePanel;o.querySelectorAll('[data-tt]').forEach(b=>b.onclick=()=>{TR.tab=b.dataset.tt;renderTeacher()});
  $('#trSyn').onchange=e=>{TR.synth=e.target.checked;renderTeacher()};$('#trAnon').onchange=e=>{TR.anon=e.target.checked;renderTeacher()};$('#trReload').onclick=()=>{TR.data=null;TR.err=null;loadTeacherData();renderTeacher()};
  if(!TR.data)return;const B=$('#trBody');const rows=citizenRows();({resumen:trResumen,ciudadanos:trCiudadanos,estudiante:trEstudiante,grupo:trGrupo,rec:trRec,exportar:trExport})[TR.tab](B,rows)}
function trResumen(B,rows){const evs=teacherEvents();const real=rows.filter(r=>!r.synth);const n=rows.length;const S=rows.map(r=>r.st);
  const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);days.push(d)}const cnt=days.map(d=>evs.filter(e=>{const t=Date.parse(e.ts);return t>=d.getTime()&&t<d.getTime()+864e5}).length);
  const errC={};evs.filter(e=>e.error_code&&e.validation!=='correct').forEach(e=>errC[e.error_code]=(errC[e.error_code]||0)+1);const top=Object.entries(errC).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const mean=a=>{a=a.filter(x=>x!=null);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null};
  B.innerHTML=`<div class="grid3"><div class="card kpi"><b>${n}</b><span>Ciudadanos con datos${TR.synth?` (${real.length} reales)`:''}</span></div><div class="card kpi"><b>${S.reduce((s,x)=>s+x.sessions,0)}</b><span>Sesiones registradas</span></div>
    <div class="card kpi"><b>${(mean(S.map(s=>s.seals))??0).toFixed(1)} / 4</b><span>Sellos de media</span></div><div class="card kpi"><b>${fmtPct(mean(S.map(s=>s.graded?s.correct/s.graded:null)))}</b><span>Aciertos medios (todas las actividades)</span></div>
    <div class="card kpi"><b>${fmtPct(mean(S.map(s=>s.corrRate)))}</b><span>Errores corregidos tras retroalimentación</span></div><div class="card kpi"><b>${S.reduce((s,x)=>s+x.activeMin,0)}</b><span>Minutos activos en total</span></div></div>
   <div class="grid2"><div class="card"><h4>Actividad de los últimos 14 días</h4>${svgBars(days.map(d=>d.toLocaleDateString('es',{weekday:'short',day:'numeric'})),cnt,{h:300,color:'var(--teal)'})}<p class="muted">Número de eventos registrados por día.</p></div>
    <div class="card"><h4>Errores más frecuentes</h4>${top.length?svgBars(top.map(t=>ERR[t[0]]?.name||t[0]),top.map(t=>t[1]),{color:'var(--err)'}):'<p class="muted">Sin errores registrados.</p>'}<p class="muted">Cuenta envíos con error, no estudiantes.</p></div></div>
   <div class="card"><h4>Quién necesita atención</h4>${attentionList(rows)}</div>`}
function attentionList(rows){const flags=[];rows.forEach(r=>{const s=r.st;if(s.errors>=8&&(s.corrRate??1)<.4)flags.push([r,`muchos errores (${s.errors}) y corrige pocos tras las pistas (${fmtPct(s.corrRate)})`]);else if(s.last&&Date.now()-s.last>7*864e5)flags.push([r,'no juega desde hace más de una semana']);else if(s.gj===0&&s.events>20)flags.push([r,'aún no ha completado ningún desafío de inversa'])});
  return flags.length?`<ul class="steps">${flags.slice(0,12).map(([r,t])=>`<li><b>${esc(r.name)}</b>: ${esc(t)}.</li>`).join('')}</ul><p class="muted">Son señales para conversar, no diagnósticos. Revisa el procedimiento en la pestaña Estudiante antes de concluir nada.</p>`:'<p class="muted">Nadie cumple los criterios de alerta con los datos actuales.</p>'}
function trCiudadanos(B,rows){const col=COLS.find(c=>c[0]===TR.sort)||COLS[0];rows.sort((a,b)=>{const x=col[2](a),y=col[2](b);return(x>y?1:x<y?-1:0)*TR.dir});
  B.innerHTML=`<div class="scroll"><table><thead><tr>${COLS.map(c=>`<th class="${c[0]==='nombre'?'':'n'}"><button class="tab" style="border:0;padding:2px 4px" data-sort="${c[0]}">${c[1]}${TR.sort===c[0]?(TR.dir>0?' ▲':' ▼'):''}</button></th>`).join('')}</tr></thead><tbody>
   ${rows.map(r=>{const s=r.st;return`<tr><td><button class="btn sm alt" data-pid="${esc(r.pid)}">${esc(r.name)}</button>${r.nick&&!TR.anon&&r.nick!==r.name?`<br><span class="muted">apodo: ${esc(r.nick)}</span>`:''}</td><td class="n">${s.seals}/4</td><td class="n">${s.gj}</td><td class="n">${fmtPct(s.accFirst)} → ${fmtPct(s.accLast)}</td>
     <td class="n">${s.errors}<br><span class="muted">${['aritmético','procedimental','conceptual','interpretación'].map(c=>(s.cat[c]||0)).join(' · ')}</span></td><td class="n">${fmtPct(s.corrRate)}</td><td class="n">${s.detective}/3</td><td class="n">${s.bWin}/${s.bLose}</td><td class="n">${s.pvpWin}/${s.pvpPlayed}</td><td class="n">${s.quizBest??'—'}${s.quizBest!=null?'/5':''}</td><td class="n">${s.tutorials}/4</td><td class="n">${s.activeMin}</td><td class="n" style="white-space:nowrap">${fmtDate(s.last)}</td></tr>`}).join('')}</tbody></table></div>
   <p class="muted">Errores: total y, debajo, aritméticos · procedimentales · conceptuales · de interpretación. Pulsa un nombre para ver su procedimiento. Pulsa una cabecera para ordenar.</p>`;
  B.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{if(TR.sort===b.dataset.sort)TR.dir*=-1;else{TR.sort=b.dataset.sort;TR.dir=b.dataset.sort==='nombre'?1:-1}renderTeacher()});
  B.querySelectorAll('[data-pid]').forEach(b=>b.onclick=()=>{TR.sel=b.dataset.pid;TR.tab='estudiante';renderTeacher()})}
function trEstudiante(B,rows){if(!rows.length){B.innerHTML='<p class="muted">Aún no hay datos.</p>';return}const r=rows.find(x=>x.pid===TR.sel)||rows[0];TR.sel=r.pid;const evs=teacherEvents().filter(e=>e.student_pid===r.pid);const s=r.st;
  const atts=[...new Set(evs.filter(e=>e.type==='attempt_start').map(e=>e.attempt_id))];const aid=TR.aid&&atts.includes(TR.aid)?TR.aid:atts[atts.length-1];const aEv=evs.filter(e=>e.attempt_id===aid);
  const steps=aEv.filter(e=>['step_submitted','op_invalid','step_assisted','interpretation'].includes(e.type));const firstErr=steps.find(e=>e.validation==='error'||e.validation==='uncertain');
  const conc={};evs.filter(e=>EV_CONCEPT_TYPES.includes(e.type)&&e.concept).forEach(e=>{const k=String(e.concept).split('.')[0];conc[k]=conc[k]||{ok:0,n:0};conc[k].n++;if(e.validation==='correct')conc[k].ok++});
  const opTxt=e=>e.action?opText({t:e.action.t,i:e.action.i,j:e.action.j,k:e.action.k?Fr.parse(e.action.k):null}):(e.type==='interpretation'?'Interpretación':e.op_type||e.type);
  B.innerHTML=`<div class="row"><label for="trSt">Ciudadano</label><select id="trSt">${rows.map(x=>`<option value="${esc(x.pid)}" ${x.pid===r.pid?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
    ${atts.length?`<label for="trAt">Intento de inversa</label><select id="trAt">${atts.map((a,i)=>`<option value="${esc(a)}" ${a===aid?'selected':''}>#${i+1}</option>`).join('')}</select>`:''}</div>
   <div class="grid3"><div class="card kpi"><b>${s.seals}/4</b><span>Sellos</span></div><div class="card kpi"><b>${fmtPct(s.accFirst)} → ${fmtPct(s.accLast)}</b><span>Precisión en inversas (primer → último intento)</span></div><div class="card kpi"><b>${fmtPct(s.corrRate)}</b><span>Corrige tras retroalimentación</span></div><div class="card kpi"><b>${s.activeMin} min</b><span>Tiempo activo estimado · ${s.sessions} sesiones</span></div></div>
   <div class="grid2"><div class="card"><h4>Aciertos por concepto</h4>${Object.keys(conc).length?svgBars(Object.keys(conc),Object.values(conc).map(c=>Math.round(c.ok/c.n*100)),{maxV:100,fmt:v=>v+' %',color:'var(--teal)'}):'<p class="muted">Sin actividades evaluadas.</p>'}<p class="muted">Rendimiento observado, no dominio: con pocos intentos la cifra es muy inestable.</p></div>
    <div class="card"><h4>Errores por categoría</h4>${Object.keys(s.cat).length?svgBars(Object.keys(s.cat),Object.values(s.cat),{color:'var(--err)'}):'<p class="muted">Sin errores.</p>'}${s.topErr?`<p>Más frecuente: <b>${esc(ERR[s.topErr]?.name||s.topErr)}</b>.</p>`:''}</div></div>
   ${aid?`${firstErr?`<div class="fb err"><p style="margin:0"><b>Primer paso incorrecto del intento:</b> ${esc(opTxt(firstErr))} · ${esc(ERR[firstErr.error_code]?.name||firstErr.error_code)} (confianza ${esc(firstErr.confidence||'—')}).</p></div>`:'<div class="fb ok"><p style="margin:0">Sin errores en este intento.</p></div>'}
   <div class="card"><h4>Reconstrucción del procedimiento</h4><div class="scroll"><table><thead><tr><th>#</th><th>Acción</th><th>Validación</th><th>Diagnóstico</th><th>Evidencia</th><th>Resultado posterior</th><th>Estado</th></tr></thead><tbody>
    ${steps.map((e,i)=>`<tr><td class="n">${i+1}</td><td class="mono">${esc(opTxt(e))}${e.try_n>1?` <span class="muted">(intento ${e.try_n})</span>`:''}</td><td>${e.validation==='correct'?'<span class="chip ok">correcto</span>':e.validation==='error'?'<span class="chip err">error</span>':e.validation==='uncertain'?'<span class="chip warn">incierto</span>':'<span class="chip">no evaluado</span>'}</td>
     <td>${e.error_code?esc(ERR[e.error_code]?.name||e.error_code)+`<br><span class="muted">${esc(e.error_category||'')} · ${esc(e.confidence||'—')}</span>`:''}</td><td class="muted">${esc(e.evidence||'')}${e.self_report?'<br>Autoinforme: «'+esc(e.self_report)+'»':''}</td><td>${esc(e.followup||'')}</td><td>${Array.isArray(e.state_after)?mxHTML(Mx.from(e.state_after),{small:true,n:e.state_after.length}):''}</td></tr>`).join('')}</tbody></table></div></div>`:'<p class="muted">Este ciudadano aún no ha hecho desafíos de inversa.</p>'}
   <div class="card"><h4>Últimas actividades</h4><div class="scroll"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Concepto</th><th>Resultado</th></tr></thead><tbody>${evs.slice(-25).reverse().map(e=>`<tr><td style="white-space:nowrap">${fmtDate(Date.parse(e.ts))}</td><td>${esc(e.type)}</td><td>${esc(e.concept||'')}</td><td>${esc(e.validation||e.result||'')}${e.error_code?' · '+esc(ERR[e.error_code]?.name||e.error_code):''}</td></tr>`).join('')}</tbody></table></div></div>`;
  $('#trSt').onchange=e=>{TR.sel=e.target.value;TR.aid=null;renderTeacher()};if($('#trAt'))$('#trAt').onchange=e=>{TR.aid=e.target.value;renderTeacher()}}
function trGrupo(B,rows){const evs=teacherEvents();const errE=evs.filter(e=>e.error_code&&e.validation!=='correct');const cats=['aritmético','procedimental','conceptual','interpretación','incierto'];
  const kinds=[['Inversa (Gauss-Jordan)',e=>e.type==='step_submitted'||e.type==='op_invalid'],['Interpretación',e=>e.type==='interpretation'],['Coliseo / duelos',e=>e.type.startsWith('battle_')],['Detective',e=>e.type==='detective_answer'],['Prueba del Sr. Pila',e=>e.type==='quiz_answer'],['Laboratorio',e=>e.type==='concept_check'||e.type==='puzzle_answer']];
  const HM=kinds.map(([_,f])=>cats.map(c=>errE.filter(e=>f(e)&&(e.error_category||'incierto')===c).length));
  const studentsWith={};errE.forEach(e=>{(studentsWith[e.error_code]=studentsWith[e.error_code]||new Set()).add(e.student_pid)});const top=Object.entries(studentsWith).map(([k,s])=>[k,s.size]).sort((a,b)=>b[1]-a[1]).slice(0,8);
  B.innerHTML=`<div class="card"><h4>Actividad × categoría de error</h4><div class="scroll">${svgHeat(kinds.map(k=>k[0]),cats,HM)}</div><p class="muted">Cuántos envíos con error de cada categoría aparecen en cada actividad.</p></div>
   <div class="card"><h4>Errores por número de estudiantes afectados</h4>${top.length?svgBars(top.map(t=>ERR[t[0]]?.name||t[0]),top.map(t=>t[1]),{color:'var(--violet)'}):'<p class="muted">Sin errores.</p>'}</div>`}
function trRec(B){B.innerHTML=`<div class="card">${groupRecommendation(teacherEvents())}</div><p class="muted">Recomendaciones calculadas a partir de los registros. No sustituyen el criterio docente ni deben ser la única base de una decisión académica.</p>`}
function csvOf(rows){return rows.map(r=>r.map(v=>{v=v==null?'':String(v);return/[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n')}
function exportTables(){const rows=citizenRows();const H=['ciudadano','apodo','sintetico','sellos','inversas_completadas','precision_primer_intento','precision_ultimo_intento','envios_evaluados','aciertos','errores','err_aritmeticos','err_procedimentales','err_conceptuales','err_interpretacion','err_inciertos','error_mas_frecuente','tasa_correccion_tras_pista','pistas','casos_detective','coliseo_ganadas','coliseo_perdidas','duelos_ganados','duelos_jugados','mejor_prueba','tutoriales','descubrimientos_lab','sesiones','minutos_activos','primera_actividad','ultima_actividad'];
  const cit=[H].concat(rows.map(r=>{const s=r.st;return[r.name,TR.anon?'':r.nick,r.synth?'si':'no',s.seals,s.gj,s.accFirst,s.accLast,s.graded,s.correct,s.errors,s.cat['aritmético']||0,s.cat['procedimental']||0,s.cat['conceptual']||0,s.cat['interpretación']||0,s.cat['incierto']||0,s.topErr?ERR[s.topErr]?.name||s.topErr:'',s.corrRate,s.hints,s.detective,s.bWin,s.bLose,s.pvpWin,s.pvpPlayed,s.quizBest,s.tutorials,s.discoveries,s.sessions,s.activeMin,s.first?new Date(s.first).toISOString():'',s.last?new Date(s.last).toISOString():'']}));
  const nameOf={};rows.forEach(r=>nameOf[r.pid]=r.name);const EH=['ciudadano','fuente','sesion','fecha','tipo','actividad','intento','concepto','operacion','paso','validacion','codigo_error','categoria_error','error','confianza','evidencia','retroalimentacion','pistas','resultado_posterior','intento_n','resultado'];
  const evs=teacherEvents();const evt=[EH].concat(evs.map(e=>[nameOf[e.student_pid]||e.student_pid,e.source,e.session_id,e.ts,e.type,e.activity_id,e.attempt_id,e.concept,e.op_type||(e.action&&e.action.t)||'',e.step_index,e.validation,e.error_code,e.error_category,e.error_code?ERR[e.error_code]?.name||'':'',e.confidence,e.evidence,e.feedback_variant,e.hints_used,e.followup,e.try_n,e.result||e.score||'']));
  const dict=[['campo','definicion']].concat([['precision_*','Pasos de inversa correctos al primer intento ÷ pasos evaluados, en el primer y el último intento completado.'],['tasa_correccion_tras_pista','Errores cuyo siguiente envío fue correcto sin que el motor calculara la fila ÷ errores con seguimiento.'],['err_*','Envíos con error por categoría de la taxonomía; un estudiante puede aportar varios.'],['confianza','alta = coincide exactamente con un patrón de error; media = patrón parcial; baja = sin patrón.'],['minutos_activos','Suma de intervalos entre eventos menores de 5 minutos.'],['sintetico','si = estudiante simulado para demostración; no evaluar.']]);
  return{cit,evt,dict}}
async function saveFile(filename,data){if(!NET.dl){$('#trOut').innerHTML=`<div class="fb warn"><p>Esta vista no permite descargar archivos. Copia el contenido:</p><textarea readonly>${esc(typeof data==='string'?data:'(archivo binario: abre el juego en claude.ai para descargarlo)')}</textarea></div>`;return}
  try{await NET.dl.save({filename,data});$('#trOut').innerHTML=`<div class="fb ok"><p style="margin:0">Listo: ${esc(filename)}.</p></div>`}catch(e){$('#trOut').innerHTML=`<div class="fb warn"><p style="margin:0">${e&&e.code==='declined'?'Descarga cancelada.':'No se pudo descargar ('+esc((e&&e.code)||'error')+').'}</p></div>`}}
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>res(window.XLSX);s.onerror=rej;document.head.appendChild(s)})}
function trExport(B){B.innerHTML=`<div class="grid2"><div class="card"><h4>Excel completo</h4><p>Un libro con tres hojas: Ciudadanos (un resumen por estudiante), Eventos (cada jugada registrada) y Diccionario (qué significa cada columna).</p><button class="btn" id="exX">Descargar .xlsx</button></div>
   <div class="card"><h4>Otros formatos</h4><div class="row"><button class="btn alt" id="exC">Ciudadanos .csv</button><button class="btn alt" id="exE">Eventos .csv</button><button class="btn alt" id="exJ">Todo .json</button></div><p class="muted" style="margin-top:8px">El CSV se abre en Excel, Google Sheets, R o Python.</p></div></div>
   <div id="trOut"></div><p class="muted">Marca «Seudónimos» arriba para exportar sin nombres (por ejemplo, para investigación). ${TR.synth?'La exportación incluirá la cohorte sintética marcada como tal.':''} Los archivos contienen datos de menores: guárdalos en un lugar seguro.</p>`;
  const stamp=new Date().toISOString().slice(0,10);
  $('#exC').onclick=()=>saveFile(`ciudadanos-${stamp}.csv`,'﻿'+csvOf(exportTables().cit));
  $('#exE').onclick=()=>saveFile(`eventos-${stamp}.csv`,'﻿'+csvOf(exportTables().evt));
  $('#exJ').onclick=()=>{const t=exportTables();saveFile(`informe-${stamp}.json`,JSON.stringify({generado:new Date().toISOString(),fuente:TR.data.src,incluye_sinteticos:TR.synth,seudonimos:TR.anon,ciudadanos:t.cit,eventos:t.evt,diccionario:t.dict},null,1))};
  $('#exX').onclick=async()=>{const b=$('#exX');b.disabled=true;b.textContent='Preparando…';try{const X=await loadXLSX();const t=exportTables();const wb=X.utils.book_new();X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(t.cit),'Ciudadanos');X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(t.evt),'Eventos');X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(t.dict),'Diccionario');
      const buf=X.write(wb,{type:'array',bookType:'xlsx'});await saveFile(`informe-ciudadanos-${stamp}.xlsx`,new Blob([buf]))}catch(e){$('#trOut').innerHTML='<div class="fb warn"><p style="margin:0">No se pudo cargar el generador de Excel. Usa el CSV.</p></div>'}b.disabled=false;b.textContent='Descargar .xlsx'}}

PANELS.board=o=>{o.innerHTML=`<div class="panel">${head('Tablón del valle','Propuesta de diseño de Matrix Arena y hoja de ruta')}
<div class="pb doc"><div class="grid2">
<div class="card"><h3>1. Concepto</h3><p>Un valle de simulación de vida en pixel 3D donde cada edificio es un modo de juego sobre matrices. El ritmo es tranquilo (huerto, ciclo de día, vecinos) y los retos son exigentes. Lo que se cultiva en el huerto crece con el aprendizaje: resolver, corregir, revisar y descubrir.</p></div>
<div class="card"><h3>2. Identidad visual</h3><p>Mundo voxel renderizado a baja resolución y escalado sin suavizado (look pixel 3D), cámara ortográfica inclinada, sombras duras, paneles de madera y pergamino, tipografía pixel para títulos y monoespaciada para matrices. Las matrices brillan en verde azulado cuando una entrada ya coincide con la identidad.</p>
<p class="muted">Alternativas valoradas: Phaser 2D (más ligero, menos profundidad), Godot Web (más potente, más pesado de cargar), Three.js con render pixelado (elegido: 3D real con estética retro, web nativa).</p></div>
<div class="card"><h3>3. Mecánicas</h3><ul><li><b>Academia</b>: recorrido por mundos (A–F), desbloqueo por evidencias.</li><li><b>Laboratorio</b>: manipulación directa con retroalimentación inmediata y retos de construcción.</li><li><b>Detective</b>: paso erróneo → explicación → corrección → verificación.</li><li><b>Batallas (Coliseo, ya jugable)</b>: duelo por turnos donde cada carta es una matriz. Atacas componiendo transformaciones que lleven tu runa a la silueta del punto débil (el orden importa y el daño es 5 + 4·|det M|). Te defiendes deshaciendo el hechizo enemigo con E⁻¹, o levantando una barrera cuando det(E) = 0. Tres rivales: rotaciones y reflexiones, cizallas y composición, matrices singulares.</li><li><b>Arena</b> (fase 4): retos amistosos y cooperativos, clasificación por progreso personal y por ligas opcionales, nunca un ranking público de errores.</li></ul></div>
<div class="card"><h3>4–5. Arquitectura pedagógica y contenidos</h3><p>Ciclo por concepto: animación conceptual → exploración → ejemplo resuelto → desafíos progresivos → evaluación integrada → errores frecuentes → transferencia. Mapa: A Descubrimiento, B Operaciones, C Transpuesta, D Determinantes, E Inversa, F Aplicaciones. Cada mundo exige los conceptos previos del grafo de dependencias.</p></div>
<div class="card"><h3>6. Progresión</h3><p>XP por esfuerzo, revisión y comprensión (corregir un error da más XP que acertar rápido). Insignias por conductas de aprendizaje. El dominio se estima por concepto con un modelo bayesiano (Beta-Binomial en el prototipo, BKT o IRT en producción).</p></div>
<div class="card"><h3>7. Modelo de interacción matemática</h3><p>El estudiante elige la operación y escribe el resultado. Cada envío guarda el estado anterior, la acción, el estado posterior y la validación exacta. El modo «motor calcula» existe para reducir carga, y en él no se infiere nada sobre aritmética.</p></div>
<div class="card"><h3>8–9. Taxonomía y motor de diagnóstico</h3><p>${Object.keys(ERR).length} códigos en 5 categorías (aritmético, procedimental, conceptual, interpretación, incierto). El motor compara la fila enviada con patrones alternativos calculados exactamente (Fi − k·Fj, Fi + Fj, k·Fi + Fj, Fi/k, bloque sin transformar…). Coincidencia exacta = confianza alta; patrón parcial = media; sin patrón = incierto y se pide una explicación breve. Un LLM solo redactaría explicaciones, nunca validaría.</p></div>
<div class="card"><h3>10. Modelo de datos</h3><p class="mono" style="font-size:12px">event{event_id, student_pid, session_id, attempt_id, activity_id, concept, difficulty, phase, type, action{t,i,j,k}, state_before, state_after, entered, expected, validation, error_code, error_category, evidence, confidence, wrong_cells, feedback_variant, hints_used, followup, try_n, active_ms, ts}</p><p>Esquema operativo (juego) separado del esquema de investigación (seudónimo re-codificado, sin estados ni texto libre).</p></div>
<div class="card"><h3>11–13. Panel docente, laboratorio estadístico y métodos</h3><p>Reconstrucción de procedimientos, primer paso incorrecto, errores con evidencia y recomendaciones con incertidumbre explícita. Estadística descriptiva, 4 hipótesis con comprobación de supuestos, efectos e IC, corrección de Holm. Diseños: pre-post, comparación de grupos, micro-experimentos aleatorizados de retroalimentación e investigación-acción.</p></div>
<div class="card"><h3>14. Arquitectura tecnológica</h3><ul><li>Cliente: React + TypeScript, Three.js (mundo), Canvas/SVG (tableros), PWA para tableta y móvil.</li><li>Servicio matemático: Python + FastAPI + SymPy (validación simbólica, generación de ejercicios). El cliente replica la aritmética exacta para responder al instante.</li><li>Analítica: Python con SciPy, statsmodels y pingouin; modelos mixtos para datos anidados.</li><li>Datos: PostgreSQL con dos esquemas (operativo / investigación), eventos vía cola (p. ej. Redis Streams), cifrado en reposo y control de acceso por roles (estudiante, docente, investigador, tutor legal).</li></ul></div>
<div class="card"><h3>15. Este prototipo</h3><p>Funciona entero en el navegador: mundo, Academia (Gauss-Jordan 2×2 y 3×3 con diagnóstico y revisión de partida), Laboratorio, Detective, Coliseo (Batallas), perfil, panel docente y Observatorio, todos leyendo los mismos eventos. La cohorte de comparación es <b>sintética</b> y se indica en cada vista.</p></div>
<div class="card"><h3>16. Plan por fases</h3><ul><li><b>Fase 1 (este prototipo)</b>: demostración integradora de la inversa.</li><li><b>Fase 2</b>: backend, cuentas con roles y consentimiento de tutores, módulos A–C, PDF/Excel.</li><li><b>Fase 3</b>: módulos D–F, más rivales y batallas 3×3 (transformaciones 3D), modelo de dominio IRT.</li><li><b>Fase 4</b>: Arena, torneos, diseñador de estudios, informes reproducibles con versión de datos.</li><li><b>Fase 5</b>: estudio piloto con aulas reales y validación del motor de diagnóstico frente a codificación experta (κ de Cohen).</li></ul></div>
<div class="card"><h3>Privacidad y ética</h3><p>Separación por roles dentro del propio mundo: los espacios del estudiante (Academia, Laboratorio, Detective, Coliseo, casas de vecinos) están abiertos; la oficina del Alcalde (panel docente) y el Observatorio (investigación) piden la llave del Alcalde. En producción esa llave es una sesión autenticada en el servidor, nunca un código guardado en el cliente.</p><p>Minimización de datos, seudonimización, información clara al estudiante (pantalla de bienvenida y perfil), borrado y exportación de los propios datos, sin perfiles de capacidad general ni personalidad, sin decisiones automáticas de alto impacto y sin venta de datos.</p></div>
